name: Sync from Notion

on:
  # Daily at 5:00 PM New York time. GitHub cron is UTC, so both candidate hours
  # are scheduled (21:00 UTC in summer, 22:00 UTC in winter) and the gate job
  # lets only the one that lands at 5 PM local time go ahead.
  schedule:
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:         # "Run workflow" button for an instant refresh
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%H)" = "17" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 5 PM in New York (it is $(TZ=America/New_York date +%H:%M)); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  sync-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull roadmap from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scripts/sync_notion.py

      - name: Commit data.json if it changed
        id: commit
        run: |
          if git diff --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "roadmap-sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Sync roadmap from Notion"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp asset versions so browsers load the new files
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          v="${{ github.run_number }}"
          sed -i "s#href=\"styles.css\"#href=\"styles.css?v=$v\"#; s#src=\"app.js\"#src=\"app.js?v=$v\"#" index.html
          grep -n "?v=" index.html

      - name: Package site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
